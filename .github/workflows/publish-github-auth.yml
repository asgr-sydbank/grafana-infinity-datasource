name: Build and publish GitHub authentication plugin

on:
  push:
    branches:
      - copilot/add-github-authentication-type

permissions:
  contents: read

jobs:
  build-and-publish:
    if: github.repository == 'asgr-sydbank/grafana-infinity-datasource'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test backend
        run: go test ./pkg/...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.18.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Build Linux backends
        run: |
          go run github.com/magefile/mage -v build:linux
          go run github.com/magefile/mage -v build:linuxarm64

      - name: Package plugin
        id: package
        shell: bash
        run: |
          plugin_id="yesoreyeram-infinity-datasource"
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Invalid plugin version."
            exit 1
          fi
          for file in module.js plugin.json gpx_infinity_linux_amd64 gpx_infinity_linux_arm64; do
            test -s "dist/$file"
          done
          chmod 755 dist/gpx_infinity_linux_amd64 dist/gpx_infinity_linux_arm64
          cp -a dist "$RUNNER_TEMP/$plugin_id"
          archive="$RUNNER_TEMP/$plugin_id-$version-linux.zip"
          (cd "$RUNNER_TEMP" && zip -qr "$archive" "$plugin_id")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload to Artifactory
        env:
          ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
          ARTIFACTORY_REPOSITORY: ${{ vars.ARTIFACTORY_REPOSITORY }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          PLUGIN_VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          if [[ "$ARTIFACTORY_URL" != https://* ]]; then
            echo "::error::Set ARTIFACTORY_URL to the HTTPS Artifactory base URL, including /artifactory."
            exit 1
          fi
          if [[ ! "$ARTIFACTORY_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Set ARTIFACTORY_REPOSITORY to a valid Generic repository key."
            exit 1
          fi
          if [[ -z "$ARTIFACTORY_TOKEN" ]]; then
            echo "::error::Set the ARTIFACTORY_TOKEN secret."
            exit 1
          fi
          plugin_id="yesoreyeram-infinity-datasource"
          destination="${ARTIFACTORY_URL%/}/${ARTIFACTORY_REPOSITORY}/${plugin_id}/${PLUGIN_VERSION}/${GITHUB_SHA}/${plugin_id}-${PLUGIN_VERSION}-linux.zip"
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 300 \
            --header "Authorization: Bearer $ARTIFACTORY_TOKEN" \
            --upload-file "$ARCHIVE" "$destination"
