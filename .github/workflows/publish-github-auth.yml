name: Build and publish GitHub authentication image

on:
  push:
    branches:
      - copilot/add-github-authentication-type

permissions:
  contents: read

jobs:
  build-and-publish:
    if: github.repository == 'asgr-sydbank/grafana-infinity-datasource'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test backend
        run: go test ./pkg/...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.18.0

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Build Linux backends
        run: |
          go run github.com/magefile/mage -v build:linux
          go run github.com/magefile/mage -v build:linuxarm64

      - name: Prepare image
        id: image
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9A-Za-z_][0-9A-Za-z_.-]*$ ]] || (( ${#version} + 1 + ${#GITHUB_SHA} > 128 )); then
            echo "::error::Plugin version cannot be used in a Docker image tag."
            exit 1
          fi
          for file in module.js plugin.json gpx_infinity_linux_amd64 gpx_infinity_linux_arm64; do
            test -s "dist/$file"
          done
          chmod 755 dist/gpx_infinity_linux_amd64 dist/gpx_infinity_linux_arm64
          mkdir -p "$RUNNER_TEMP/grafana-image"
          cp -a dist "$RUNNER_TEMP/grafana-image/dist"
          cp docker/Dockerfile "$RUNNER_TEMP/grafana-image/Dockerfile"
          echo "tag=artifactory.sydbank.dev/iu-docker-snapshot-local/grafana-infinity-ghauth:${version}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check Artifactory credentials
        env:
          ARTIFACTORY_USERNAME: ${{ vars.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$ARTIFACTORY_USERNAME" ]]; then
            echo "::error::Set the ARTIFACTORY_USERNAME repository variable."
            exit 1
          fi
          if [[ -z "$ARTIFACTORY_TOKEN" ]]; then
            echo "::error::Set the ARTIFACTORY_TOKEN secret."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Artifactory
        uses: docker/login-action@v3
        with:
          registry: artifactory.sydbank.dev
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Build and push Linux image
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/grafana-image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
